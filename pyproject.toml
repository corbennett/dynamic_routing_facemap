[project]
name = "dynamic-routing-facemap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "corbennett", email = "corbennett@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dr-datacube",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "polars>=1.44.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[project.scripts]
dynamic-routing-facemap = "dynamic_routing_facemap.decode_facemap:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
dr-datacube = { git = "https://github.com/AllenNeuralDynamics/dr-datacube.git" }
